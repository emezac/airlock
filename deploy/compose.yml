# Airlock on one VM: Postgres, the control service (with Solid Queue and the
# git repositories inside), and Caddy in front with automatic HTTPS.
#
#   cp deploy/env.example deploy/.env    # then fill it in
#   docker compose -f deploy/compose.yml --env-file deploy/.env up -d --build
#
# See deploy/README.md.

name: airlock

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: control
      POSTGRES_PASSWORD: ${CONTROL_DATABASE_PASSWORD:?set CONTROL_DATABASE_PASSWORD}
      # Created here: the app cannot boot against a missing database.
      POSTGRES_DB: control_production
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U control -d control_production"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: airlock:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://control:${CONTROL_DATABASE_PASSWORD}@db/control_production
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE}
      AGENTKIT_AUDIT_KEY: ${AGENTKIT_AUDIT_KEY:?set AGENTKIT_AUDIT_KEY}
      AIRLOCK_HOOK_SECRET: ${AIRLOCK_HOOK_SECRET:?set AIRLOCK_HOOK_SECRET}
      AIRLOCK_REVIEW_TOKEN: ${AIRLOCK_REVIEW_TOKEN:?set AIRLOCK_REVIEW_TOKEN}
      NEBIUS_TOKEN: ${NEBIUS_TOKEN:-}
      NEBIUS_PROJECT_ID: ${NEBIUS_PROJECT_ID:-}
      NEBIUS_SANDBOX: ${NEBIUS_SANDBOX:-false}
      AIRLOCK_FORCE_SSL: ${AIRLOCK_FORCE_SSL:-true}
      AIRLOCK_SEED_DEMO: ${AIRLOCK_SEED_DEMO:-1}
      JOB_THREADS: ${JOB_THREADS:-8}
      RAILS_LOG_LEVEL: ${RAILS_LOG_LEVEL:-info}
    volumes:
      - data:/data
    # Not published: Caddy is the only way in. The git hook calls the gate on
    # 127.0.0.1 inside this container.
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/up"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      AIRLOCK_HOST: ${AIRLOCK_HOST:?set AIRLOCK_HOST, e.g. 203-0-113-7.sslip.io}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data

volumes:
  pg:
  data:
  caddy:
