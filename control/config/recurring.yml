production:
  # Wakes the merge queue for anything approved or queued while no job was
  # running (after a restart, or a job that died).
  merge_queue_sweep:
    class: MergeQueueSweepJob
    schedule: every minute
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
