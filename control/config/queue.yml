# Solid Queue, in the primary database (see db/migrate/*_create_solid_queue_tables.rb).
# Agents run for minutes each, so the worker needs one thread per agent plus
# room for routing, the merge queue, diagnosis and renders.
default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "*"
      threads: <%= ENV.fetch("JOB_THREADS", 8) %>
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.5

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
