# Airlock policy used by this service. See ../../../airlock.toml.example.

[gate]
require_evidence_trailer = "Airlock-Evidence"
protected_refs = ["refs/heads/main"]
merge_identity = "airlock"          # only the merge queue updates protected refs
agent_prefix = "agent-"             # pushers named agent-* are agents
reject_on_secret = true
reject_on_deleted_or_skipped_tests = true

[paths]
human_review = ["billing/", "sharing/", "auth/", "migrations/", "Cargo.toml", "tests/golden/"]  # golden images: a human sees every visual change
forbidden = ["infra/"]
tests = ["tests/", "test/", "spec/"]
core = ["src/core/"]         # changes here raise risk

[labels.area]
# Path prefix -> area label. The allowed "area" values are these plus "multiple" and "other".
"src/core/" = "core_renderer"
"src/spec.rs" = "spec"
"src/board.rs" = "board"
"src/bin/" = "cli"
"examples/" = "examples"
"src/films/" = "films"
"src/puppet/" = "characters"
"src/render/" = "export"
"src/timeline/" = "timeline"
"src/audio/" = "audio"
"billing/" = "billing"
"auth/" = "auth"
"sharing/" = "sharing"
"migrations/" = "data"
"tests/" = "tests"
"docs/" = "docs"

[routing]
# A change goes to a human when any effective label matches (category:value).
human_when = [
  "safety_flag:touches_money", "safety_flag:touches_auth", "safety_flag:touches_data",
  "safety_flag:weakens_safeguard", "test_signal:tests_weakened", "goal_clarity:vague",
  "dependency:added_or_changed",
]

[risk]
target_utilization = 0.7      # keep human queue utilization rho below this
failure_rate_alpha = 0.1      # exponential forgetting for per-agent failure rate
human_reviews_per_hour = 6    # prior for mu until real review times exist
min_threshold = 0.35          # never auto-merge above this risk, whatever the load

[merge_queue]
max_batch = 9

[evidence]
verify = true                 # re-run each agent's evidence command in a clean sandbox
# The evidence command must be exactly one of these, optionally with arguments.
allowed_commands = ["cargo test", "cargo run --release --bin frameline"]

[sandbox]
enabled = true                # needs NEBIUS_TOKEN and NEBIUS_PROJECT_ID
image = "ubuntu:latest"       # replace with the prebuilt Rust image for Frameline

[ci]
command = "cargo test -q"
timeout_seconds = 900

[render]
# After every green batch, main is rendered with this command (the policy's,
# never an agent's) through the same runner as CI, and the files it leaves in
# `output` are shown on the Frameline tab.
command = """mkdir -p out/airlock && \
for s in examples/specs/*.yaml; do \
  cargo run -q --release --bin frameline -- board "$s" -o "out/airlock/$(basename "$s" .yaml).png" --tile-width 480 || exit 1; \
done && \
cargo run -q --release --bin frameline -- animatic examples/specs/lumen_ad.yaml -o out/airlock/lumen_ad.mp4 --width 640"""
timeout_seconds = 1200
output = "out/airlock/"

[audit]
sample_rate = 0.10
