[package]
name = "taller_film"
version = "0.1.0"
edition = "2021"

[dependencies]
tiny-skia = "0.11"
rayon = "1.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
hound = "3.5"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
anyhow = "1.0"
